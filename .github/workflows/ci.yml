name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Hosted runners have no reliable GPU; Metal-dependent tests skip themselves
      # (see Tests/CleanCutKitTests/Support/TestEnvironment.swift).
      - name: Test CleanCutKit (macOS)
        run: |
          set -o pipefail
          xcodebuild test -project CleanCut.xcodeproj -scheme CleanCutKit \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO | Tools/scripts/xcfilter.sh

      - name: Build app (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build -project CleanCut.xcodeproj -scheme CleanCut \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/dd \
            CODE_SIGNING_ALLOWED=NO | Tools/scripts/xcfilter.sh
